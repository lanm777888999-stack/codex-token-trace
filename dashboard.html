<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Trace</title>
  <style>
    :root {
      --bg: #101114;
      --panel: #17191d;
      --panel-2: #1f2227;
      --line: #30343a;
      --text: #f2f0ea;
      --muted: #9da2a8;
      --cyan: #30d5c8;
      --amber: #f2a93b;
      --rose: #e86978;
      --blue: #7aa7ff;
      --green: #62c578;
      --shadow: rgba(0, 0, 0, .28);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    body[data-theme="light"] {
      --bg: #f4f5f8;
      --panel: #ffffff;
      --panel-2: #f7f7fb;
      --line: #e6e8ef;
      --text: #101827;
      --muted: #717987;
      --cyan: #7657e8;
      --amber: #f59f37;
      --rose: #e2556f;
      --blue: #5a9be7;
      --green: #55bfa6;
      --shadow: rgba(28, 35, 55, .07);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .top {
      position: sticky;
      top: 0;
      z-index: 3;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 210px; }
    .mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--cyan);
      color: #061313;
      font-weight: 800;
    }
    .brand strong { display: block; font-size: 14px; letter-spacing: .08em; }
    .brand span { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .tabs { display: flex; gap: 4px; flex: 1; }
    .tab {
      height: 34px;
      padding: 0 12px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 7px;
      color: var(--muted);
    }
    .tab.active { color: var(--text); background: var(--panel-2); border-color: var(--line); }
    .actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 7px;
    }
    .btn.primary { background: var(--cyan); color: #061313; border-color: var(--cyan); font-weight: 700; }
    body[data-theme="light"] .btn.primary { color: #ffffff; }
    .wrap { max-width: 1360px; margin: 0 auto; padding: 20px; }
    .grid { display: grid; gap: 12px; }
    .summary { grid-template-columns: 1.2fr .8fr .8fr .8fr; }
    .main { grid-template-columns: minmax(360px, .82fr) minmax(0, 1.18fr); margin-top: 12px; align-items: start; }
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: 0 18px 48px var(--shadow);
    }
    .box { padding: 16px; }
    .label { color: var(--muted); font-size: 12px; }
    .value { font-size: 42px; line-height: 1; font-weight: 800; margin-top: 12px; }
    .kpi .value { font-size: 27px; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 7px; line-height: 1.5; }
    .bar { height: 9px; display: flex; overflow: hidden; border-radius: 4px; background: var(--panel-2); margin-top: 18px; }
    .bar i { display: block; height: 100%; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; margin-right: 5px; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .head h2 { margin: 0; font-size: 16px; }
    .head span { color: var(--muted); font-size: 12px; }
    .tasks { padding: 8px; }
    .task {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 11px 10px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 7px;
      text-align: left;
      overflow: hidden;
    }
    .task:hover, .task.active { background: var(--panel-2); border-color: var(--line); }
    .task > div:first-child { min-width: 0; }
    .task-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; font-size: 13px; }
    .task-meta { color: var(--muted); font-size: 11px; margin-top: 5px; }
    .task-total { text-align: right; font-weight: 750; }
    .task-total small { display: block; color: var(--muted); font-weight: 400; margin-top: 5px; }
    .split { padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(3, 1fr); }
    .slice { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 13px; }
    .slice strong { display: block; font-size: 23px; margin-top: 9px; }
    .models { padding: 16px; display: grid; gap: 8px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .model { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 12px; min-width: 0; }
    .model.best { border-color: var(--green); }
    .model-name { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model strong { display: block; font-size: 21px; margin-top: 8px; }
    .model small { display: block; color: var(--muted); font-size: 11px; margin-top: 5px; }
    .chart { height: 210px; padding: 10px 16px 16px; }
    svg { width: 100%; height: 100%; display: block; color: var(--muted); }
    .price-table { width: 100%; border-collapse: collapse; }
    .price-table th, .price-table td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: right; font-size: 13px; }
    .price-table th:first-child, .price-table td:first-child { text-align: left; }
    .price-table th { color: var(--muted); font-weight: 500; }
    .price-table input {
      width: 96px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      text-align: right;
    }
    .pack {
      white-space: pre-wrap;
      overflow: auto;
      max-height: 64vh;
      padding: 16px;
      font: 12px/1.65 "Cascadia Code", Consolas, monospace;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .hidden { display: none; }
    .file-input { display: none; }
    body[data-theme="light"] { background: linear-gradient(180deg, #f7f8fb 0%, #f1f3f7 100%); }
    body[data-theme="light"] .top {
      background: rgba(247, 248, 251, .88);
      border-bottom-color: #e5e7ee;
      box-shadow: 0 10px 28px rgba(25, 31, 45, .04);
    }
    body[data-theme="light"] .mark {
      border-radius: 9px;
      color: #ffffff;
      background: linear-gradient(145deg, #8f73ff, #6b4ee8);
      box-shadow: 0 8px 18px rgba(118, 87, 232, .28);
    }
    body[data-theme="light"] .brand strong {
      color: #101827;
      letter-spacing: 0;
    }
    body[data-theme="light"] .tab {
      color: #5f6878;
      font-weight: 600;
    }
    body[data-theme="light"] .tab.active {
      color: #6f52e6;
      background: #eee9ff;
      border-color: transparent;
    }
    body[data-theme="light"] .btn {
      border-radius: 11px;
      border-color: #e6e8ef;
      background: #f3f4f8;
      color: #333b49;
      font-weight: 600;
    }
    body[data-theme="light"] .btn:hover { background: #eceff6; }
    body[data-theme="light"] .btn.primary {
      color: #ffffff;
      border-color: transparent;
      background: linear-gradient(135deg, #7d60ed, #6347db);
      box-shadow: 0 10px 22px rgba(118, 87, 232, .22);
    }
    body[data-theme="light"] .panel {
      border-color: #e7e9f0;
      border-radius: 12px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 14px 36px rgba(20, 27, 42, .06);
    }
    body[data-theme="light"] .label {
      color: #667085;
      font-weight: 600;
    }
    body[data-theme="light"] .value {
      color: #101827;
      letter-spacing: -.04em;
    }
    body[data-theme="light"] .sub { color: #7a8290; }
    body[data-theme="light"] .bar {
      border-radius: 999px;
      background: #ececf3;
    }
    body[data-theme="light"] .bar i:first-child { background: linear-gradient(90deg, #7657e8, #9178ff) !important; }
    body[data-theme="light"] .bar i:nth-child(2) { background: #55bfa6 !important; }
    body[data-theme="light"] .bar i:nth-child(3) { background: #f5a33b !important; }
    body[data-theme="light"] .legend {
      color: #727b89;
    }
    body[data-theme="light"] .head {
      border-bottom-color: #edf0f5;
    }
    body[data-theme="light"] .head h2 {
      color: #101827;
      letter-spacing: -.02em;
    }
    body[data-theme="light"] .head span { color: #7a8290; }
    body[data-theme="light"] .task {
      border-radius: 10px;
      border-color: transparent;
    }
    body[data-theme="light"] .task:hover,
    body[data-theme="light"] .task.active {
      background: #f5f2ff;
      border-color: #e1dbff;
    }
    body[data-theme="light"] .task.active { box-shadow: inset 3px 0 0 #7657e8; }
    body[data-theme="light"] .task-name {
      color: #1b2433;
      font-weight: 750;
    }
    body[data-theme="light"] .task-total { color: #101827; }
    body[data-theme="light"] .slice,
    body[data-theme="light"] .model {
      border-color: #e8eaf1;
      background: #fafbfe;
      border-radius: 12px;
    }
    body[data-theme="light"] .slice strong,
    body[data-theme="light"] .model strong {
      color: #101827;
      letter-spacing: -.03em;
    }
    body[data-theme="light"] .model.best {
      border-color: #b9adff;
      background: linear-gradient(180deg, #fbfaff, #f4f0ff);
    }
    body[data-theme="light"] .chart {
      border-top: 1px solid #f0f1f5;
      color: #8b93a1;
    }
    body[data-theme="light"] .price-table th,
    body[data-theme="light"] .price-table td { border-bottom-color: #eceef4; }
    body[data-theme="light"] .price-table input {
      background: #f7f8fb;
      border-color: #e0e3eb;
      border-radius: 10px;
    }
    body[data-theme="light"] .pack {
      background: #ffffff;
      border-color: #e7e9f0;
      box-shadow: 0 14px 36px rgba(20, 27, 42, .06);
    }
    body[data-theme="light"] .toast {
      color: #ffffff;
      background: #101827;
      box-shadow: 0 12px 30px rgba(16, 24, 39, .20);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 9px 13px;
      border-radius: 7px;
      font-size: 13px;
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 980px) {
      .summary, .main { grid-template-columns: 1fr; }
      .models, .split { grid-template-columns: 1fr 1fr; }
      .tabs { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><div class="mark">T</div><div><strong>Token 计量</strong><span>本机数据面板</span></div></div>
    <nav class="tabs">
      <button class="tab active" data-view="overview">总览</button>
      <button class="tab" data-view="prices">价格</button>
      <button class="tab" data-view="pack">数据包</button>
    </nav>
    <div class="actions">
      <button class="btn" data-action="theme">浅色</button>
      <button class="btn" data-action="cover">悬浮封面</button>
      <button class="btn" data-action="prices">模型价格</button>
      <button class="btn primary" data-action="copy">复制提示词+数据</button>
      <input class="file-input" id="coverInput" type="file" accept="image/*">
    </div>
  </header>

  <main class="wrap">
    <section id="overviewView">
      <div class="grid summary">
        <article class="panel box">
          <div class="label">今日累计 Token</div>
          <div class="value" id="todayTotal">--</div>
          <div class="bar" id="compositionBar"></div>
          <div class="legend" id="compositionLegend"></div>
        </article>
        <article class="panel box kpi"><div class="label">今日任务</div><div class="value" id="taskCount">--</div><div class="sub">按 Codex 对话归类</div></article>
        <article class="panel box kpi"><div class="label">请求次数</div><div class="value" id="requestCount">--</div><div class="sub">今日模型调用</div></article>
        <article class="panel box kpi"><div class="label">缓存命中</div><div class="value" id="cacheRate">--</div><div class="sub">缓存输入 / 总输入</div></article>
      </div>

      <div class="grid main">
        <article class="panel">
          <div class="head"><h2>各任务 Token 占比</h2><span>按今日消耗排序</span></div>
          <div class="tasks" id="taskList"></div>
        </article>
        <section class="grid">
          <article class="panel">
            <div class="head"><h2>Token 构成</h2><span id="selectedTaskName">今日全部任务</span></div>
            <div class="split" id="tokenSplit"></div>
          </article>
          <article class="panel">
            <div class="head"><h2>模型费用对比</h2><span>按今日总量套算，同量不代表同等效果</span></div>
            <div class="models" id="modelList"></div>
            <div class="chart" id="timeline"></div>
          </article>
        </section>
      </div>
    </section>

    <section id="pricesView" class="hidden">
      <article class="panel">
        <div class="head"><h2>模型价格表</h2><span>单位：USD / 1M Token，本机保存</span><button class="btn" data-action="reset">恢复默认</button></div>
        <table class="price-table">
          <thead><tr><th>模型</th><th>地区</th><th>新输入</th><th>缓存输入</th><th>输出</th><th>今日理论消费</th></tr></thead>
          <tbody id="priceRows"></tbody>
        </table>
      </article>
    </section>

    <section id="packView" class="hidden">
      <div class="head" style="padding-left:0;padding-right:0;border-bottom:0"><h2>提示词 + 数据包</h2><button class="btn primary" data-action="copy">复制</button></div>
      <pre class="pack" id="packText"></pre>
    </section>
  </main>
  <div class="toast" id="toast">已复制</div>

  <script>
    const state = { data: null, view: "overview", selected: "", theme: localStorage.getItem("token-trace-theme") || "dark" };
    const themeColors = {
      dark: ["#30d5c8", "#62c578", "#f2a93b", "#7aa7ff", "#e86978"],
      light: ["#7657e8", "#55bfa6", "#f5a33b", "#5a9be7", "#e2556f"],
    };
    let colors = themeColors.dark;

    function fmt(n) {
      n = Number(n);
      if (!Number.isFinite(n)) return "--";
      if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2).replace(/\.0+$/, "") + "B";
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0+$/, "") + "M";
      if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0+$/, "") + "k";
      return Math.round(n).toLocaleString("zh-CN");
    }
    function money(n) {
      n = Number(n) || 0;
      return n >= 1000 ? "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 }) : "$" + n.toFixed(n >= 10 ? 2 : 3);
    }
    function pct(n) {
      return Number.isFinite(Number(n)) ? Math.round(Number(n) * 100) + "%" : "--";
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }
    function compactTitle(label) {
      let text = String(label || "").replace(/\s+/g, " ").trim();
      if (!text) return "";
      const lower = text.toLowerCase();
      if (lower.includes("token") && text.includes("可视化") && text.includes("平台")) return "澄清 Token 平台视觉需求";
      text = text
        .replace(/^这是我现在做好的一个/i, "")
        .replace(/^我现在想要/i, "")
        .replace(/^现在需要你/i, "")
        .replace(/^请你/i, "")
        .replace(/^帮我/i, "");
      const parts = text.split(/[。！？；;\n]|[，,]/).map(x => x.trim()).filter(Boolean);
      const keywords = ["需求", "实现", "验证", "评估", "创建", "汇总", "查找", "设计", "修复", "方案", "平台", "教程", "插件"];
      const scored = parts
        .filter(x => x.length >= 4)
        .map(x => ({ text: x, score: keywords.reduce((sum, key) => sum + (x.includes(key) ? 2 : 0), 0) - Math.max(0, x.length - 22) / 10 }))
        .sort((a, b) => b.score - a.score);
      const chosen = (scored[0] && scored[0].text) || parts[0] || text;
      return chosen.length > 22 ? chosen.slice(0, 21) + "…" : chosen;
    }
    function modelCost(price, source) {
      const input = Number(source?.input) || 0;
      const cached = Math.min(input, Number(source?.cached) || 0);
      const output = Number(source?.output) || 0;
      return ((input - cached) * price.fresh + cached * price.cached + output * price.output) / 1e6;
    }

    async function load() {
      const res = await fetch("/api/state", { cache: "no-store" });
      state.data = await res.json();
      if (!state.selected) state.selected = state.data.daily?.tasks?.[0]?.threadId || "";
      render();
    }
    function setView(view) {
      state.view = view;
      document.querySelectorAll(".tab").forEach(btn => btn.classList.toggle("active", btn.dataset.view === view));
      document.getElementById("overviewView").classList.toggle("hidden", view !== "overview");
      document.getElementById("pricesView").classList.toggle("hidden", view !== "prices");
      document.getElementById("packView").classList.toggle("hidden", view !== "pack");
      if (view === "pack") refreshPack();
    }
    function setTheme(theme) {
      state.theme = theme === "light" ? "light" : "dark";
      colors = themeColors[state.theme];
      document.body.dataset.theme = state.theme;
      localStorage.setItem("token-trace-theme", state.theme);
      fetch("/api/theme", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ theme: state.theme }) }).catch(() => {});
      const btn = document.querySelector("[data-action='theme']");
      if (btn) btn.textContent = state.theme === "light" ? "深色" : "浅色";
      if (state.data) render();
    }
    function render() {
      if (!state.data) return;
      setView(state.view);
      const daily = state.data.daily || {};
      const tasks = daily.tasks || [];
      const selected = tasks.find(t => t.threadId === state.selected) || tasks[0] || daily;
      document.getElementById("todayTotal").textContent = fmt(daily.total);
      document.getElementById("taskCount").textContent = fmt(daily.taskCount || tasks.length);
      document.getElementById("requestCount").textContent = fmt(daily.requestCount);
      document.getElementById("cacheRate").textContent = pct(daily.input ? daily.cached / daily.input : null);
      renderComposition(daily);
      renderTasks(tasks, daily.total || 0);
      renderSplit(selected);
      renderModels(daily);
      renderTimeline(daily);
      renderPrices();
    }
    function renderComposition(daily) {
      const input = Number(daily.input) || 0;
      const cached = Math.min(input, Number(daily.cached) || 0);
      const uncached = Math.max(0, input - cached);
      const output = Number(daily.output) || 0;
      const total = Math.max(1, uncached + cached + output);
      document.getElementById("compositionBar").innerHTML = [
        ["新输入", uncached, colors[0]], ["缓存", cached, colors[1]], ["输出", output, colors[2]]
      ].map(x => `<i style="width:${Math.max(0, x[1] / total * 100)}%;background:${x[2]}"></i>`).join("");
      document.getElementById("compositionLegend").innerHTML = [
        ["新输入", uncached, colors[0]], ["缓存", cached, colors[1]], ["输出", output, colors[2]]
      ].map(x => `<span><i class="dot" style="background:${x[2]}"></i>${x[0]} ${fmt(x[1])}</span>`).join("");
    }
    function renderTasks(tasks, total) {
      document.getElementById("taskList").innerHTML = tasks.length ? tasks.map((task, index) => {
        const share = total ? task.total / total : 0;
        const rawLabel = task.label || "任务 " + String(task.threadId).slice(0, 8);
        return `<button class="task ${task.threadId === state.selected ? "active" : ""}" data-task="${esc(task.threadId)}" title="${esc(rawLabel)}">
          <div><div class="task-name">${index + 1}. ${esc(compactTitle(rawLabel))}</div><div class="task-meta">${fmt(task.requestCount)} 次请求 · ${fmt(task.turnCount)} 轮</div></div>
          <div class="task-total">${fmt(task.total)}<small>${(share * 100).toFixed(1)}%</small></div>
        </button>`;
      }).join("") : `<div class="box sub">今天还没有可统计任务。</div>`;
    }
    function renderSplit(source) {
      document.getElementById("selectedTaskName").textContent = compactTitle(source.label) || "今日全部任务";
      const input = Number(source.input) || 0;
      const cached = Math.min(input, Number(source.cached) || 0);
      const uncached = Math.max(0, input - cached);
      const output = Number(source.output) || 0;
      document.getElementById("tokenSplit").innerHTML = [
        ["新输入", uncached, colors[0]], ["缓存输入", cached, colors[1]], ["输出", output, colors[2]]
      ].map(x => `<div class="slice"><div class="label">${x[0]}</div><strong style="color:${x[2]}">${fmt(x[1])}</strong></div>`).join("");
    }
    function renderModels(daily) {
      const rows = [...(state.data.prices || [])].map(p => ({ ...p, cost: modelCost(p, daily) })).sort((a, b) => a.cost - b.cost);
      document.getElementById("modelList").innerHTML = rows.map((row, i) => `<div class="model ${i === 0 ? "best" : ""}"><div class="model-name">${esc(row.name)}</div><strong>${money(row.cost)}</strong><small>${i === 0 ? "最低理论消费" : esc(row.region)}</small></div>`).join("");
    }
    function renderTimeline(daily) {
      const timeline = daily.timeline || [];
      const rows = [...(state.data.prices || [])].map(p => ({ ...p, cost: modelCost(p, daily) })).sort((a, b) => a.cost - b.cost).slice(0, 3);
      const series = rows.map(row => {
        let sum = 0;
        return timeline.map(bucket => (sum += modelCost(row, bucket)));
      });
      const max = Math.max(1, ...series.flat());
      const path = values => values.map((value, i) => {
        const x = 20 + (i / 23) * 720;
        const y = 178 - (value / max) * 150;
        return `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`;
      }).join(" ");
      document.getElementById("timeline").innerHTML = `<svg viewBox="0 0 760 205" preserveAspectRatio="none">
        ${[0, .5, 1].map(r => `<path d="M20 ${178 - r * 150}H740" stroke="currentColor" opacity=".12"/>`).join("")}
        ${series.map((values, i) => `<path d="${path(values)}" fill="none" stroke="${colors[i]}" stroke-width="3" stroke-linecap="round"/>`).join("")}
        <text x="20" y="198" fill="currentColor" opacity=".56" font-size="11">00:00</text>
        <text x="380" y="198" fill="currentColor" opacity=".56" text-anchor="middle" font-size="11">12:00</text>
        <text x="740" y="198" fill="currentColor" opacity=".56" text-anchor="end" font-size="11">现在</text>
      </svg>`;
    }
    function renderPrices() {
      const daily = state.data.daily || {};
      document.getElementById("priceRows").innerHTML = (state.data.prices || []).map(price => `<tr>
        <td><strong>${esc(price.name)}</strong></td><td>${esc(price.region)}</td>
        ${["fresh", "cached", "output"].map(field => `<td><input type="number" min="0" step="0.01" value="${price[field]}" data-id="${price.id}" data-field="${field}"></td>`).join("")}
        <td>${money(modelCost(price, daily))}</td>
      </tr>`).join("");
    }
    async function savePrices() {
      const prices = state.data.prices;
      await fetch("/api/prices", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prices }) });
      await load();
    }
    async function refreshPack() {
      const res = await fetch("/api/pack", { cache: "no-store" });
      const data = await res.json();
      document.getElementById("packText").textContent = data.text || "";
    }
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message || "已完成";
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }
    async function copyPack() {
      const res = await fetch("/api/pack", { cache: "no-store" });
      const data = await res.json();
      await navigator.clipboard.writeText(data.text || "");
      showToast("已复制");
    }
    async function imageFromFile(file) {
      const url = URL.createObjectURL(file);
      try {
        const image = new Image();
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = url;
        });
        return image;
      } finally {
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    }
    async function uploadCover(file) {
      if (!file) return;
      const image = await imageFromFile(file);
      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
      ctx.clip();
      const srcSize = Math.min(image.naturalWidth || image.width, image.naturalHeight || image.height);
      const sx = ((image.naturalWidth || image.width) - srcSize) / 2;
      const sy = ((image.naturalHeight || image.height) - srcSize) / 2;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(image, sx, sy, srcSize, srcSize, 0, 0, size, size);
      ctx.restore();
      const dataUrl = canvas.toDataURL("image/png");
      const res = await fetch("/api/cover", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ dataUrl }) });
      if (!res.ok) throw new Error("cover upload failed");
      showToast("悬浮封面已更新");
    }

    document.addEventListener("click", event => {
      const task = event.target.closest("[data-task]");
      if (task) { state.selected = task.dataset.task; render(); return; }
      const action = event.target.closest("[data-action]")?.dataset.action;
      const tab = event.target.closest("[data-view]")?.dataset.view;
      if (tab) setView(tab);
      if (action === "prices") setView("prices");
      if (action === "theme") setTheme(state.theme === "light" ? "dark" : "light");
      if (action === "cover") document.getElementById("coverInput").click();
      if (action === "copy") copyPack();
      if (action === "reset") fetch("/api/prices/reset", { method: "POST" }).then(load);
    });
    document.getElementById("coverInput").addEventListener("change", event => {
      uploadCover(event.target.files?.[0]).catch(() => showToast("封面更新失败")).finally(() => { event.target.value = ""; });
    });
    document.addEventListener("input", event => {
      const input = event.target.closest("input[data-id]");
      if (!input) return;
      const price = state.data.prices.find(item => item.id === input.dataset.id);
      if (!price) return;
      price[input.dataset.field] = Math.max(0, Number(input.value) || 0);
      savePrices();
    });
    setTheme(state.theme);
    load();
    setInterval(load, 1500);
  </script>
</body>
</html>
